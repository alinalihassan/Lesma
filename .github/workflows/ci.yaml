name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  BUILD_TYPE: Release
  CC: clang
  CXX: clang++

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Unshallow vcpkg submodule
        run: git -C vcpkg fetch --unshallow

      - name: Install dependencies with Homebrew
        env:
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew update
          brew install llvm@21 lld@21 cmake ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm@21);$(brew --prefix lld@21)" >> $GITHUB_ENV

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: cmake --preset Release_Dist_CI -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build
        run: cmake --build --preset Release_Dist_CI

      - name: Test
        working-directory: ${{github.workspace}}/build/Release
        run: ctest -C ${{env.BUILD_TYPE}} --rerun-failed --output-on-failure

      - name: Package Artifact
        working-directory: ${{github.workspace}}/build/Release
        run: ninja package

      - uses: actions/upload-artifact@v7
        with:
          name: lesma-macos
          path: ${{github.workspace}}/build/Release/Lesma*.tar.gz

  memory:
    name: Memory
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Unshallow vcpkg submodule
        run: git -C vcpkg fetch --unshallow

      - name: Install dependencies with Homebrew
        env:
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew update
          brew install llvm@21 lld@21 cmake ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm@21);$(brew --prefix lld@21)" >> $GITHUB_ENV

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure Debug_Asan
        run: cmake --preset Debug_Asan -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build Debug_Asan
        run: cmake --build --preset Debug_Asan

      - name: Run ARC memory suite
        env:
          ASAN_OPTIONS: detect_container_overflow=0
          LESMA_TEST_TIMEOUT: 5
        run: ./scripts/run_tests.sh build/Debug_Asan/lesma

  release:
    name: Release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Semantic Release Dependencies
        run: |
          npm install -g @semantic-release/changelog @semantic-release/git @google/semantic-release-replace-plugin

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: lesma-*
          merge-multiple: true

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @google/semantic-release-replace-plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}