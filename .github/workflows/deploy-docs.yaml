# Deploy docs + playground (Bun API + static SPA) to Cloudflare Workers + Containers.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (API token: Workers Scripts Edit + Account Containers Edit, or broader templates).

name: Deploy Docs

on:
  push:
    branches: [main, dev]

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unshallow vcpkg
        run: git -C vcpkg fetch --unshallow || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wrangler dependencies
        working-directory: tools/playground
        run: bun install --frozen-lockfile

      - name: Deploy Worker and container image
        working-directory: tools/playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
